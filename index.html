<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>둥지 테니스 기록</title>
<meta name="theme-color" content="#162248">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png?v=2" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="둥지 테니스">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f4; --card:#ffffff; --ink:#1d2420; --muted:#6b746e; --line:#e3e6e1;
  --accent:#2f6b3f; --accent-soft:#e6f0e8; --win:#2f6b3f; --loss:#b0483a; --loss-soft:#f7e6e3;
  --ball:#d7e84a; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141816; --card:#1d2220; --ink:#e8ece9; --muted:#9aa49d; --line:#2c3330;
    --accent:#7cc48e; --accent-soft:#22332a; --win:#7cc48e; --loss:#e48a7c; --loss-soft:#3a2522; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);padding:18px 16px 0;position:sticky;top:0;z-index:5}
.wrap{max-width:920px;margin:0 auto}
.club{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.club::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--ball);box-shadow:inset -2px -2px 0 rgba(0,0,0,.12)}
h1{margin:2px 0 10px;font-size:21px;font-weight:700;letter-spacing:-.3px}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{padding:16px;padding-bottom:100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:700}
.card h2 small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
select,input[type=text],input[type=number],input[type=date],textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:36px}
textarea{width:100%;min-height:120px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
th[data-act]{cursor:pointer;user-select:none}
th.sorted{color:var(--accent)}
th:first-child,td:first-child{text-align:center;width:44px}
td.name,th.name{text-align:left}
.tablewrap{overflow-x:auto;margin:0 -6px}
.rank1 td:first-child{font-weight:700;color:var(--accent)}
a.p{color:inherit;text-decoration:none;font-weight:500;cursor:pointer;border-bottom:1px dotted var(--muted)}
a.p:hover{color:var(--accent)}
.chips{display:inline-flex;gap:3px}
.chip{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:700}
.chip.W{background:var(--accent-soft);color:var(--win)}
.chip.D{background:var(--line);color:var(--muted)}
.chip.L{background:var(--loss-soft);color:var(--loss)}
.pos{color:var(--win)} .neg{color:var(--loss)}
.muted{color:var(--muted)} .small{font-size:13px}
.day{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:500}
.day:first-child{margin-top:0}
.match{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.match:last-child{border-bottom:0}
.match .side{font-size:14px}
.match .side.b{text-align:right}
.match .side.win,.match .side.win a.p{font-weight:700;color:var(--win)}
.match .score{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;min-width:56px;text-align:center}
.match .note{grid-column:2/5;font-size:12px;color:var(--muted);margin-top:-6px}
.drawtag{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:1.1}
.badge{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.badge.S{background:var(--line);color:var(--muted)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px}
.x:hover{background:var(--loss-soft);color:var(--loss)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field>span{font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 16px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.team{display:flex;flex-direction:column;gap:6px}
.team b{font-size:13px}
.team select{width:100%}
.vs{padding-bottom:8px;color:var(--muted);font-weight:700}
.scorebox{display:flex;align-items:center;gap:8px;justify-content:center;margin:6px 0}
.scorebox input{width:70px;text-align:center;font-size:20px;font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 4px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:3px 11px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
button.primary,button.ghost,button.danger{border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:500;border:1px solid transparent}
button.primary{background:var(--accent);color:#fff}
button.primary:disabled{opacity:.5;cursor:default}
button.ghost{background:var(--card);border-color:var(--line)}
button.danger{background:var(--loss);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.err{color:var(--loss);font-size:13px;margin:6px 0}
.help{font-size:13px;color:var(--muted);margin:4px 0 10px}
.help code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:12px}
.new{font-size:11px;background:var(--ball);color:#333;border-radius:4px;padding:0 4px;margin-left:3px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.banner{background:var(--loss-soft);color:var(--loss);font-size:13px;padding:6px 10px;border-radius:8px;margin-bottom:8px}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);padding:12px 16px;display:flex;justify-content:center;align-items:center;gap:14px;z-index:10}
.savebar button{background:var(--ball);color:#222;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;z-index:30;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--card);border-radius:14px;padding:20px;max-width:420px;width:100%}
.modal p{margin:0 0 16px;white-space:pre-line}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;margin-bottom:10px;font-weight:500}
.plist td input{border:1px solid transparent;background:transparent;padding:4px 6px;min-height:30px;width:120px}
.plist td input:hover,.plist td input:focus{border-color:var(--line);background:var(--card)}
.inactive{opacity:.55}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sync{background:none;border:0;font-size:12px;color:var(--muted);cursor:pointer;padding:2px 4px}
.sync.off{color:var(--loss)}
button.ghost.tiny{padding:3px 10px;font-size:12px}
header{padding-top:max(18px,env(safe-area-inset-top))}
.podium{display:grid;gap:8px}
.prize{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.prize.r1{background:var(--accent-soft);border-color:var(--accent)}
.prize .medal{grid-row:1/3;font-size:28px}
.prize .pname{font-weight:700;font-size:16px}
.prize .pstat{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.evrow{display:grid;gap:2px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.evrow:hover{border-color:var(--accent)}
.evname{font-weight:700}
.evtag{color:var(--accent);font-weight:500}
.evnote{background:var(--accent-soft);border-color:var(--accent);font-size:14px}
.evhead .evtitle{font-size:20px;font-weight:700;margin:2px 0;border:1px solid transparent;background:transparent;padding:2px 4px;width:100%}
.evhead input.evtitle:hover,.evhead input.evtitle:focus{border-color:var(--line);background:var(--card)}
.seasonrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.seasonrow:last-child{border-bottom:0}
.seasonrow>div:nth-child(2){grid-column:1}
.seasonrow>button{grid-column:2;grid-row:1/3}
.seasonlist{display:grid;gap:6px;margin-bottom:10px}
.seasonedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seasonedit .sname{width:90px}
.seasonedit input[type=date]{min-height:32px;padding:4px 6px}
.seasonedit.add{padding-top:10px;border-top:1px dashed var(--line)}
button.primary.tiny{padding:6px 12px;font-size:13px}
.mbtns{display:inline-flex;gap:0}
.card.editing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap}
button.ghost.purge{color:var(--loss)}
.mbtns{gap:4px}
.club .clublogo{width:22px;height:24px;object-fit:contain;margin-right:2px}
.club.haslogo::before{display:none}
.notice{font-size:14px}
.notice ol{margin:6px 0 10px;padding-left:20px}
.notice .row{gap:6px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
